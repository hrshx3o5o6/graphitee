[project]
name = "graphitee"
version = "0.1.0"
description = "Semantic article ingestion system using Playwright"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]

[project.scripts]
graphitee = "main:main"
