[project]
name = "graphitee"
version = "0.1.0"
description = "Agentic semantic knowledge graph companion for reading"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "playwright>=1.40.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "networkx>=3.0.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    "aiosqlite>=0.19.0",
    "rich>=13.7.0",
    "tavily>=0.2.0",
    # Neo4j GraphRAG
    "neo4j-graphrag[ollama]>=1.0.0",
    "neo4j>=5.18",
]

[project.scripts]
graphitee = "main:main"
graphitee-cli = "cli:main"
